<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Nav -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>Student Portal</h2>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#"><i class="fa-solid fa-users"></i> Students</a></li>
                <li><a href="#" onclick="showComingSoon('Dashboard')"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="#" onclick="showComingSoon('Settings')"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="header-title">
                    <h1>Student Records</h1>
                    <p>Mini-Project Demo</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="openAddModalBtn">
                        <i class="fa-solid fa-plus"></i> Add Student
                    </button>
                </div>
            </header>

            <!-- Tools / Filters -->
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by name or course...">
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table id="studentsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Course</th>
                            <th>Marks</th>
                            <th>Attendance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <!-- Rows dynamically populated here -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state hidden">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>No students found.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Student Modal (Add/Edit) -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Student</h2>
                <span class="close-btn" id="closeModalBtn">&times;</span>
            </div>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber" name="rollNumber" required>
                </div>
                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" name="course" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="marks">Marks (%)</label>
                        <input type="number" id="marks" name="marks" min="0" max="100" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="attendance">Attendance (%)</label>
                        <input type="number" id="attendance" name="attendance" min="0" max="100" step="0.1" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveStudentBtn">Save Student</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Confirm Delete</h2>
                <span class="close-btn" id="closeDeleteModalBtn">&times;</span>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this student? This action cannot be undone.</p>
                <input type="hidden" id="deleteStudentId">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
